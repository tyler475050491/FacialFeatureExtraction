plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hpt.faceextraction'
    compileSdk 34

    defaultConfig {
        applicationId "com.hpt.faceextraction"
        minSdk 28
        targetSdk 30
        versionCode 1
        versionName "1.0.0"
        ndk { abiFilters 'armeabi-v7a' }
    }

    // 与消费机同平台（RK 板卡），使用平台签名才能调用 SystemClock.setCurrentTimeMillis 校时
    signingConfigs {
        release {
            storeFile file("keystore/platformrk.jks")
            storePassword 'hptface'
            keyAlias 'platform'
            keyPassword 'hptface'
        }
        debug {
            storeFile file("keystore/platformrk.jks")
            storePassword 'hptface'
            keyAlias 'platform'
            keyPassword 'hptface'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE']
        }
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.4.0'

    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    implementation 'com.google.code.gson:gson:2.8.9'

    // 旷视 FacePassCore 内部使用 RxJava3（缺依赖会导致 FaceCore 初始化失败）
    implementation 'io.reactivex.rxjava3:rxjava:3.1.8'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    // FaceCore/facepass 为 Kotlin 编写，运行期需要 kotlin-stdlib
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.4.32'

    // 旷视 FaceCore 算法封装（com.hpt.facecore / com.hpt.facepass / mcv.facepass）
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}
